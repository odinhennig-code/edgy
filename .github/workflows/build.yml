name: Edgy.exe bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version lesen
        id: version
        shell: bash
        run: |
          VER=$(python -c "from edgy.version import VERSION; print(VERSION)")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "neu=nein" >> "$GITHUB_OUTPUT"
          else
            echo "neu=ja" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sprache testen
        shell: bash
        run: python tests/test_sprache.py

      - name: Fenster testen
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install pillow
          python tests/test_fenster.py

      - name: Screenshots ablegen (Branch test-screenshots)
        if: always()
        shell: bash
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q -b test-screenshots
          git config user.name "Edgy Test"
          git config user.email "edgy@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots vom Fenster-Test" || exit 0
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-screenshots
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Edgy.exe bauen
        if: steps.version.outputs.neu == 'ja'
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name Edgy --icon assets/edgy.ico --add-data "assets;assets" main.py

      - name: Neue Version veröffentlichen
        if: steps.version.outputs.neu == 'ja'
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.ver }}" dist/Edgy.exe \
            --title "Edgy v${{ steps.version.outputs.ver }}" \
            --notes "Neue Version von Edgy. Wer Edgy schon hat, bekommt sie beim nächsten Start automatisch."
        env:
          GH_TOKEN: ${{ github.token }}
